name: ci
description: Continuous-integration checks (install, lint, test, build).
settings:
  fail_fast: true
  max_parallel: 4
steps:
  - id: install
    name: Install dependencies
    run: "python -m pip install -e ."
  - id: lint
    name: Lint
    run: "ruff check ."
    depends_on: [install]
  - id: typecheck
    name: Type check
    run: "mypy"
    depends_on: [install]
  - id: test
    name: Tests
    run: "python -m pytest"
    depends_on: [install]
  - id: build
    name: Build
    run: "python -m build"
    depends_on: [lint, typecheck, test]
