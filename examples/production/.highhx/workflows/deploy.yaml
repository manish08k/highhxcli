name: deploy
description: Test, deploy to staging, then (after approval) to production.
steps:
  - id: test
    run: pytest -q
  - id: staging
    run: highhx deploy staging --yes
    depends_on: [test]
    approval:
      risk: dangerous
      message: Deploys to staging.
  - id: production
    run: highhx deploy production
    depends_on: [staging]
    approval:
      risk: critical
      bypassable: false
      message: Deploys to production after staging is healthy.
