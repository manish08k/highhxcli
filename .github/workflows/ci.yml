name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q

  platform:
    name: Platform backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]" -e "./server[dev]"
      - name: Type check
        run: mypy server/src --ignore-missing-imports --disallow-untyped-defs --check-untyped-defs
      - name: Test
        working-directory: server
        run: pytest -q

  package:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python -m pip install build && python -m build && python -m build server --outdir dist
      - name: Clean install
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/highhxcli-*.whl
          /tmp/clean/bin/highhx --version
          /tmp/clean/bin/highhx account plans --json > /dev/null
