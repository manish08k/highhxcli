name: test
description: Lint, type-check and test in parallel.
settings:
  fail_fast: false
  max_parallel: 3
steps:
  - id: lint
    name: Lint
    run: {{ commands.lint }}
  - id: typecheck
    name: Type check
    run: {{ commands.typecheck }}
  - id: test
    name: Tests
    run: {{ commands.test }}
